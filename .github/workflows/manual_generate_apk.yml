name: Generate Android APK
on:
  push:
    branches:
    - master
    tags:
      - "v*.*"
  workflow_dispatch:
    inputs:
      buildVariant:
        type: choice
        description: 'Build Variant'
        required: true
        default: 'NormalOptimized'
        options: 
        - NormalOptimized
        - NormalDebug
        - VROptimized
        - VRDebug
        - LegacyOptimized

jobs:
  apk:
    name: Generate ${{ github.event.inputs.buildVariant || 'NormalOptimized' }} APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check Valid Version Tags
        id: valid-tags
        shell: bash
        run: |
          echo "count=$(git tag -l 'v[0-9]*' | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Fetch upstream tags
        if: steps.valid-tags.outputs.count == '0'
        run: |
          git remote add upstream https://github.com/hrydgard/ppsspp.git
          git fetch --deepen=15000 --no-recurse-submodules --tags --force upstream || exit 0

      - name: Setup JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Extract version from git
        id: version
        run: |
          VERSION_NAME=$(git describe --always --tags --dirty)
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Version: $VERSION_NAME (code $VERSION_CODE)"

      - name: Assemble APK
        working-directory: android
        run: |
          ./gradlew assemble${{ github.event.inputs.buildVariant || 'NormalOptimized' }} \
            -PversionName=${{ env.VERSION_NAME }} \
            -PversionCode=${{ env.VERSION_CODE }} \
            --stacktrace

      - name: Package build
        run: |
          find . -name "*.apk"
          mkdir -p ppsspp
          if [ -e android/build/*/apk/*/*/*.apk ]; then
            cp android/build/*/apk/*/*/*.apk ppsspp/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ github.event.inputs.buildVariant || 'NormalOptimized' }} build
          path: ppsspp/